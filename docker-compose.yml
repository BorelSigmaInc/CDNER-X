version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: yosemite_postgres
    environment:
      POSTGRES_USER: yosemite
      POSTGRES_PASSWORD: yosemite
      POSTGRES_DB: yosemite
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: yosemite_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
