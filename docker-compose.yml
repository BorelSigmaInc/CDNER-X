services:
  postgres:
    image: postgres:16
    container_name: yosemite_postgres
    environment:
      POSTGRES_USER: yosemite
      POSTGRES_PASSWORD: yosemite
      POSTGRES_DB: yosemite
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: yosemite_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: yosemite-backend:latest
    container_name: yosemite_backend
    depends_on:
      - postgres
      - redis
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql://yosemite:yosemite@postgres:5432/yosemite
      REDIS_URL: redis://redis:6379/0
      ENGINE_ACTIVE: "true"

  engine:
    build:
      context: .
      dockerfile: bonding-engine/Dockerfile
    image: yosemite-engine:latest
    container_name: yosemite_engine
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_INTERNAL_BASE: http://backend:8000
        NEXT_PUBLIC_API_BASE: ""
    image: yosemite-frontend:latest
    container_name: yosemite_frontend
    depends_on:
      - backend
    ports:
      - "5173:3000"
    environment:
      API_INTERNAL_BASE: http://backend:8000

volumes:
  pgdata:
  redisdata:
